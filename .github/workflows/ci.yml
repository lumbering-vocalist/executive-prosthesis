name: CI

on:
  push:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    env:
      # Secrets aren't readable in step `if:` expressions; surface presence
      # via env so the codegen drift check can self-skip until the founder
      # adds the CONVEX_DEPLOY_KEY repo secret (TODOS: CI codegen check).
      CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - name: Convex codegen drift check
        # convex/_generated is committed; regenerate against the deployment
        # and fail if it drifted from convex/schema.ts. Self-skips (with a
        # notice, not silently green) until CONVEX_DEPLOY_KEY exists.
        if: ${{ env.CONVEX_DEPLOY_KEY != '' }}
        run: |
          npx convex codegen
          git diff --exit-code convex/_generated
      - name: Convex codegen drift check (skipped)
        if: ${{ env.CONVEX_DEPLOY_KEY == '' }}
        run: echo "::notice::codegen drift check skipped — add the CONVEX_DEPLOY_KEY repo secret to enable it"
      - run: npm run build
        env:
          # No Sentry upload in CI; init is a no-op without a DSN.
          SENTRY_SUPPRESS_TURBOPACK_WARNING: "1"
          # ConvexReactClient is constructed at module scope during prerender;
          # the build never opens a connection, so a placeholder URL is enough.
          NEXT_PUBLIC_CONVEX_URL: "https://placeholder.convex.cloud"
